/* Layout: 12-col page grid; configurator 8 cols + sticky summary 4 cols from 1024px, single column with section chips and a buy bar below. */
:root {
  color-scheme: light;
  --sticky-top: 16px;     /* gap under the viewport edge for the sticky summary */
  --nav-h: 0px;           /* height of the sticky section chips (mobile) */
  --bar-h: 0px;           /* height of the mobile buy bar */
}
@media (max-width: 1023px) { :root { --sticky-top: 48px; --nav-h: 49px; --bar-h: 68px; } } /* sticky-top = the fixed mobile header */
.mhead { position: sticky; top: 0; z-index: 40; background: var(--bg-default); }

html { scroll-behavior: auto; }
body { margin: 0; background: var(--bg-default); color: var(--text-primary); font: var(--text-body-md); -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; }

/* Page container = DS .nsl-container: 1170 up to 1679px, the wide 1530 container from 1680px, fluid below 1024. */

/* ---------- Product top ---------- */
.crumbs { padding-block: 20px 16px; }
/* Title first, then the gallery across the whole block, then specs and price */
.top { display: flex; flex-direction: column; gap: 24px; }
.cfg__main { min-width: 0; }
.top__head { margin-bottom: 24px; }
@media (max-width: 1023px) { .top__head { margin-bottom: 20px; } }
.top__head { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.top__info { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 30px; min-width: 0; }
.top__title { margin: 0; font: var(--text-heading-xl); text-wrap: balance; }
.top__badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.top .nsl-gallery, .top > :nth-child(2) { width: 100%; }
@media (max-width: 1023px) { .top { gap: 20px; } .top__title { font: var(--text-heading-lg); } .top__info { flex-direction: column; align-items: flex-start; } }
.tabs { margin-top: 40px; border-bottom: 1px solid var(--border-default); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
@media (max-width: 1023px) { .tabs { margin-top: 28px; } }

/* ---------- Two-column configurator ---------- */
.cfg { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: 30px; align-items: start; padding-block: 0 96px; }
.tabs + .sec, .tabs ~ div > .sec:first-child { padding-top: 24px; }
@media (max-width: 1023px) { .cfg { grid-template-columns: 1fr; padding-bottom: calc(48px + var(--bar-h)); } .cfg-aside { display: none !important; } }
@media (min-width: 1024px) { .chipnav, .buybar { display: none !important; } }

/* ---------- ConfigSection (new) ---------- */
.sec { position: relative; isolation: isolate; padding-block: 32px; scroll-margin-top: calc(var(--sticky-top) + var(--nav-h) + 8px); }
.sec:first-child { border-top: 0; }
.sec:has(.nsl-pop__panel) { z-index: 5; }
.sec::before { content: ""; position: absolute; inset: 10px -16px; z-index: -1; border-radius: var(--radius-lg); background: var(--bg-default); box-shadow: 0 0 0 2px var(--secondary-200), 0 8px 24px rgba(29, 108, 190, 0.18); opacity: 0; transition: opacity 1s ease-out; pointer-events: none; }
.sec.is-flash::before { opacity: 1; transition: none; }
/* a section with an error lands with a red glow instead of the blue one */
.sec--error::before { box-shadow: 0 0 0 2px color-mix(in srgb, var(--status-error) 45%, transparent), 0 8px 24px color-mix(in srgb, var(--status-error) 20%, transparent); }
@media (max-width: 719px) { .sec { padding-block: 24px; } .sec::before { inset: 6px -8px; } }
.sec__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 16px; }
.sec__title { margin: 0; font: var(--text-heading-md); outline: none; display: flex; align-items: center; gap: 10px; }
.sec__title:focus-visible { box-shadow: var(--shadow-focus); border-radius: var(--radius-sm); }
.sec__meta { font: var(--text-body-sm); color: var(--text-secondary); }
.sec__body { display: flex; flex-direction: column; gap: 12px; }
.sec__lead { margin: 0; font: var(--text-body-sm); color: var(--text-secondary); max-width: 64ch; }
.sec__lead a, .link { color: var(--text-link); text-decoration: underline; text-underline-offset: 2px; }
.sec--off .sec__title { color: var(--text-disabled); }
.sec--off .sec__head { margin-bottom: 0; }

/* Option group label (new) */
.ogrp { display: flex; align-items: center; gap: 8px; margin-top: 8px; font: var(--text-mono-2xs-bold); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary); }
.ogrp:first-child { margin-top: 0; }
.rows { display: flex; flex-direction: column; gap: 4px; }
.rows__more { align-self: flex-start; }
.opt-meta { display: block; margin-top: 2px; font: var(--text-body-xs); opacity: 0.72; }
.opt-meta .nsl-tag { vertical-align: middle; margin-left: 6px; }


/* CPU details popover inside the option row */
.cpu-info { display: inline-flex; vertical-align: middle; margin-left: 6px; }
.cpu-info__btn { display: inline-grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: inherit; opacity: 0.7; cursor: pointer; }
.cpu-info__btn:hover, .cpu-info__btn[aria-expanded="true"] { opacity: 1; }
.cpu-info__btn:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
.cpu-info .nsl-pop__panel { cursor: default; text-align: left; white-space: normal; }
.cpu-pop { display: flex; flex-direction: column; gap: 10px; }
.cpu-pop dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font: var(--text-body-sm); }
.cpu-pop dt { color: inherit; opacity: 0.7; }
.cpu-pop dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; }
.cpu-pop__note { margin: 0; font: var(--text-body-xs); opacity: 0.8; }

.dc-pop { display: flex; flex-direction: column; gap: 14px; }
.dc-pop__addr { display: flex; align-items: center; gap: 8px; margin: 0; font: var(--text-mono-xs-medium); color: var(--text-secondary); }
.dc-pop__sec { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; }
.dc-pop__ic { color: var(--secondary-default); padding-top: 1px; }
.dc-pop__h { margin: 0 0 6px; font: 600 14px/20px var(--font-sans); color: var(--secondary-default); }
.dc-pop__tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.dc-pop__t { margin: 0; font: var(--text-body-sm); }
.dc-pop__list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font: var(--text-body-sm); }

/* UsageMeter (new) */
.meter { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px 14px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--bg-subtle); }
.meter__k { font: var(--text-mono-2xs-bold); text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); }
.meter__track { height: 6px; border-radius: var(--radius-full); background: var(--neutral-200); overflow: hidden; }
.meter__fill { height: 100%; border-radius: inherit; background: var(--secondary-default); transition: width 0.3s ease; }
.meter__v { font: var(--text-mono-xs-medium); font-variant-numeric: tabular-nums; color: var(--text-primary); white-space: nowrap; }
.meter--warning .meter__fill { background: var(--status-warning); }
.meter--error .meter__fill { background: var(--status-error); }
.meter--error .meter__v { color: var(--tag-error-text); }
.meters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 719px) { .meters { grid-template-columns: 1fr; } .meter { grid-template-columns: 1fr auto; } .meter__track { grid-column: 1 / -1; grid-row: 2; } }

/* InlinePromo (new) */
.promo { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--border-secondary-subtle); border-radius: var(--radius-md); background: var(--secondary-50); }
.promo__icon { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--bg-default); color: var(--secondary-default); }
.promo__t { margin: 0 0 2px; font: var(--text-heading-xs); }
.promo__d { margin: 0; font: var(--text-body-sm); color: var(--text-secondary); }

/* ---------- ConfigSummary (new) ---------- */
.cfg-aside { position: sticky; top: var(--sticky-top); max-height: calc(100vh - 2 * var(--sticky-top)); display: flex; flex-direction: column; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-default); box-shadow: var(--shadow-sm); overflow: hidden; }
.sum__head { flex: none; padding: 16px 20px 12px; border-bottom: 1px solid var(--border-default); }
.sum__eyebrow { font: var(--text-mono-2xs-bold); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary); }
.sum__name { margin: 4px 0 0; font: var(--text-body-md-semibold); }
.sum__progress { margin-top: 8px; display: flex; align-items: center; gap: 8px; font: var(--text-body-xs); color: var(--text-secondary); }
.sum__progress b { font-weight: 600; color: var(--text-primary); }
.sum__progress .warn { color: var(--tag-warning-text); font-weight: 600; }
.sum__list { position: relative; flex: 1 1 auto; min-height: 120px; overflow-y: auto; overscroll-behavior: contain; padding: 6px 0; scrollbar-width: thin; }
.sum__inner { position: relative; }
.sum__item { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; width: 100%; padding: 7px 20px; border: 0; background: transparent; text-align: left; color: var(--text-primary); cursor: pointer; }
.sum__item:hover { background: var(--bg-subtle); }
.sum__item:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--secondary-200); }
.sum__item.is-active { background: var(--bg-muted); }
.sum__item.is-active .sum__k { color: var(--text-primary); }
.sum__k { display: flex; align-items: center; gap: 6px; font: var(--text-label-sm-semibold); color: var(--text-secondary); }
.sum__p { font: var(--text-mono-xs-medium); font-variant-numeric: tabular-nums; color: var(--text-primary); text-align: right; white-space: nowrap; }
.sum__p s { color: var(--text-disabled); margin-right: 4px; font-weight: 400; }
.sum__v { grid-column: 1 / -1; font: var(--text-body-sm); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sum__item.is-empty .sum__v { color: var(--text-secondary); }
.sum__item.is-changed { animation: changed 1.1s ease-out; }
@keyframes changed { 0% { background: var(--secondary-100); } 100% { background: transparent; } }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.dot--warning { background: var(--status-warning); }
.dot--error { background: var(--status-error); }
.sum__item .dot { box-shadow: 0 0 0 2px var(--bg-default); }

.sum__foot { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 16px; border-top: 1px solid var(--border-default); background: var(--bg-default); }
.total { position: relative; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-inline: -8px; padding: 4px 8px; border-radius: var(--radius-md); }
.total__k { font: var(--text-heading-xs); }
.total__v { display: flex; align-items: baseline; gap: 8px; }
.total__v s { font: var(--text-body-sm); color: var(--text-disabled); }
.total__v b { font: 700 24px/32px var(--font-mono); color: var(--secondary-default); font-variant-numeric: tabular-nums; }
.total.is-bump { animation: bump 0.7s ease-out; }
@keyframes bump { 0% { background: var(--secondary-100); } 100% { background: transparent; } }
.delta { position: absolute; right: 8px; top: -18px; font: var(--text-mono-2xs-bold); color: var(--secondary-default); animation: delta 1.6s ease-out forwards; pointer-events: none; }
@keyframes delta { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-4px); } }
@media (max-height: 820px) { .monthly { display: none; } .sum__foot { gap: 8px; padding-block: 12px; } .sum__head { padding-block: 12px 10px; } }
.monthly { margin: -6px 0 2px; font: var(--text-body-xs); color: var(--text-secondary); text-align: right; }
.sum__btns { display: grid; gap: 8px; }
.sum__help { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 2px; border: 0; background: none; font: var(--text-body-sm); color: var(--text-link); cursor: pointer; }
.sum__help:hover { text-decoration: underline; }
.sum__help:focus-visible { outline: none; box-shadow: var(--shadow-focus); border-radius: var(--radius-sm); }

/* ---------- Mobile: section chips (new SectionNav) ---------- */
.chipnav { position: sticky; top: var(--sticky-top); z-index: 30; height: var(--nav-h); margin-inline: calc((100vw - 100%) / -2); padding-inline: calc((100vw - 100%) / 2); display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; background: var(--bg-default); border-bottom: 1px solid var(--border-default); }
.chipnav::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border-default); border-radius: var(--radius-full); background: var(--bg-default); font: var(--text-label-md); color: var(--text-primary); cursor: pointer; white-space: nowrap; }
.chip.is-active { border-color: var(--text-primary); background: var(--text-primary); color: var(--text-on-brand); }
.chip.is-active .dot { box-shadow: 0 0 0 2px var(--text-primary); }
.chip:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
.chipnav__end { flex: none; width: 1px; }

/* ---------- Mobile: StickyBuyBar (new) ---------- */
.buybar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; align-items: center; gap: 10px; min-height: var(--bar-h); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--bg-default); border-top: 1px solid var(--border-default); box-shadow: 0 -6px 16px rgba(17, 24, 39, 0.06); }
.buybar__help { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-default); color: var(--brand-default); cursor: pointer; }
.buybar__sum { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 2px 6px; margin-left: -6px; border: 0; border-radius: var(--radius-md); background: transparent; text-align: left; cursor: pointer; color: var(--text-primary); }
.buybar__k { display: flex; align-items: center; gap: 4px; font: var(--text-label-sm); color: var(--text-secondary); }
.buybar__v { font: 700 18px/24px var(--font-mono); color: var(--secondary-default); font-variant-numeric: tabular-nums; }
.buybar__sum .dot { margin-left: 2px; }
.buybar__sum.is-bump { animation: bump 0.7s ease-out; }
.buybar__help:focus-visible, .buybar__sum:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
.sheet-total { display: flex; align-items: baseline; justify-content: space-between; font: var(--text-heading-xs); }
.sheet-total b { font: 700 20px/28px var(--font-mono); color: var(--secondary-default); }
.sheet-sum .sum__item { padding-left: 16px; border-radius: var(--radius-md); }
.sheet-sum { margin-inline: -8px; }

/* Help form */
.help { display: flex; flex-direction: column; gap: 16px; }
.help-note { font: var(--text-body-xs); color: var(--text-secondary); text-align: center; }
.help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 419px) { .help-grid { grid-template-columns: 1fr; } }

.foot-gap { height: 0; }
@media (prefers-reduced-motion: reduce) {
  .meter__fill { transition: none; }
  .sec::before { transition: none; }
  .total.is-bump, .buybar__sum.is-bump, .sum__item.is-changed, .delta { animation: none; }
}
</style>
